[package]
name = "omp-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "omp_desktop"
path = "src/lib.rs"

[[bin]]
name = "omp-desktop"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
gpui-kit = { version = "0.10", default-features = false, features = ["component", "assets", "gpui-fast"] }
omp-core = { path = "../omp-core" }
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.10", default-features = false, features = ["component", "assets", "gpui-fast", "test-support"] }

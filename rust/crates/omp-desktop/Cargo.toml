[package]
name = "omp-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "omp_desktop"
path = "src/lib.rs"

[[bin]]
name = "omp-desktop"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
gpui-kit = { version = "0.10", default-features = false, features = ["component", "assets", "gpui-fast"] }
# The Browser pane hosts a native webview. `gpui-webview`'s `gpui-fast` feature must
# follow `gpui-kit`'s, which selects the GPUI backend (a mismatch fails to compile).
gpui-webview = { version = "0.10", default-features = false, features = ["gpui-fast"] }
omp-core = { version = "2.0.0", path = "../omp-core" }
serde_json.workspace = true
# `gpui-webview` builds from a `wry::WebViewBuilder`, which it does not re-export; this is
# the same `lb-wry` fork and version it depends on.
wry = { version = "0.53.3", package = "lb-wry", default-features = false }

# The system tray (src/tray.rs) is macOS/Windows only, so its crates are gated to
# those targets. `tray-icon`'s Linux backend links GTK3 *and* libappindicator
# (`libappindicator3-dev`/`libayatana-appindicator3-dev`) plus libxdo, none of which
# the Linux CI image installs — it only has `libgtk-3-dev` for `gpui-webview`. Gating
# here (rather than only in code) keeps the Linux build free of those system headers.
# `default-features = false` drops the `libxdo` feature; nothing in the tray uses the
# predefined Cut/Copy/Paste items it enables.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.21", default-features = false }
# Tray/menu callbacks fire outside GPUI's update cycle; commands cross into the app
# through this channel instead of touching GPUI state from the callback thread.
async-channel = "2"
# The tray icon is derived from the bundled app icon at runtime, so no separate
# tray asset ships. Only the PNG decoder is needed.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "0.10", default-features = false, features = ["component", "assets", "gpui-fast", "test-support"] }

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz is pulled by rrule for schedule recurrence; no maintained replacement is available yet. Revisit before v2.0.0." },
  { id = "RUSTSEC-2026-0543", reason = "chrono is used for ISO timestamps and is also required by rrule; migrating to jiff/time is a v2.1 follow-up." },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "0BSD", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

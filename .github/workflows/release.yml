name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    # Every downstream job checks out this commit SHA instead of the tag, so a
    # tag moved mid-run cannot make two jobs build different commits.
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight
      - name: Validate tag and package versions
        run: node scripts/release/validate-release-tag.mjs --tag "$RELEASE_TAG"
      # fetch-depth: 0 above is what populates refs/remotes/origin/*; the check
      # is evaluated against main's tip at run time, so a commit that is on main
      # when the release starts can still be rewritten out of main afterwards.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Pin the release to the resolved commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  quality:
    name: Release tooling
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm ci
      - run: npm run release:preflight
      - run: npm run typecheck
      - run: npm run check
      - run: npm test

  package-rust:
    # The signed packages are built on every release. Without
    # RUST_UPDATER_SIGNING_KEY the signing step skips with a notice, and the
    # release aggregate then fails closed instead of publishing a release with
    # no signed artifacts.
    name: Package the Rust application
    needs: [validate, quality]
    strategy:
      # cargo-packager archives the host binary, so every leg runs on a native
      # runner; a cross-compiled leg would publish the wrong architecture.
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
            format: app
          - platform: macos-x86_64
            runner: macos-15-intel
            format: app
          - platform: linux-x86_64
            runner: ubuntu-22.04
            format: appimage
          - platform: windows-x86_64
            runner: windows-2022
            format: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Install the AppImage tooling dependencies
        if: matrix.format == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build the release application
        run: cargo build -p omp-desktop --release --locked
        working-directory: rust
        env:
          # Baked in with option_env!. An empty value ships an app whose updater
          # row reports "not configured" instead of trusting a feed.
          OMP_UPDATER_PUBKEY: ${{ vars.RUST_UPDATER_PUBKEY }}
      # The updater rejects unsigned artifacts, so a missing key skips packaging
      # with a notice instead of publishing files no client can verify.
      - name: Package and sign the application
        id: package
        shell: bash
        working-directory: rust/crates/omp-desktop
        env:
          RUST_UPDATER_SIGNING_KEY: ${{ secrets.RUST_UPDATER_SIGNING_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.RUST_UPDATER_SIGNING_KEY }}
        run: |
          if [ -z "$RUST_UPDATER_SIGNING_KEY" ]; then
            echo "::notice::RUST_UPDATER_SIGNING_KEY is not configured; skipping the signed Rust package and updater feed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo packager --formats ${{ matrix.format }} --release --binaries-dir ../../target/release
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Upload the signed macOS application archive
        if: steps.package.outputs.signed == 'true' && matrix.format == 'app'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-package-${{ matrix.platform }}
          path: |
            rust/dist/*.app.tar.gz
            rust/dist/*.sig
          if-no-files-found: error
      - name: Upload the signed Linux AppImage
        if: steps.package.outputs.signed == 'true' && matrix.format == 'appimage'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-package-${{ matrix.platform }}
          path: |
            rust/dist/*.AppImage
            rust/dist/*.sig
          if-no-files-found: error
      - name: Upload the signed Windows installer
        if: steps.package.outputs.signed == 'true' && matrix.format == 'nsis'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-package-${{ matrix.platform }}
          path: |
            rust/dist/*-setup.exe
            rust/dist/*.sig
          if-no-files-found: error

  release-packages:
    needs: [validate, package-rust]
    # Always run the aggregate gate. A skipped job can satisfy a required check,
    # so failures are asserted by an explicit first step rather than encoded in
    # the job-level condition.
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Fail if a release prerequisite did not succeed
        if: >-
          always() && (needs.validate.result != 'success' || needs.package-rust.result != 'success')
        run: |
          echo "Release prerequisite results: validate=${{ needs.validate.result }}, package-rust=${{ needs.package-rust.result }}"
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: rust-package-*
          path: rust-artifacts
      # download-artifact extracts each artifact into a `rust-package-<os>-<arch>`
      # directory; the updater feed and the release layout use `<os>-<arch>`.
      - name: Lay the Rust packages out as <os>-<arch> platform directories
        run: |
          shopt -s nullglob
          for directory in rust-artifacts/rust-package-*; do
            mv "$directory" "rust-artifacts/${directory##*rust-package-}"
          done
      - name: Fail closed unless every signed Rust package was produced
        run: |
          shopt -s nullglob
          for platform in macos-aarch64 macos-x86_64 linux-x86_64 windows-x86_64; do
            signatures=(rust-artifacts/"$platform"/*.sig)
            if [ "${#signatures[@]}" -eq 0 ]; then
              echo "Missing the signed $platform Rust package. The updater rejects unsigned artifacts, so the release is not publishable without RUST_UPDATER_SIGNING_KEY."
              exit 1
            fi
          done
      - name: Add the signed Rust packages to the release assets
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          paths=(rust-artifacts/*/*)
          names=()
          for path in "${paths[@]}"; do
            if [ -f "$path" ]; then names+=("${path##*/}"); fi
          done
          duplicates=$(printf '%s\n' "${names[@]}" | LC_ALL=C sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Two Rust packages publish the same asset name: $duplicates"
            exit 1
          fi
          for path in "${paths[@]}"; do
            if [ -f "$path" ]; then cp "$path" release-assets/; fi
          done
      - name: Write SHA-256 checksums for every published asset
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          shopt -s nullglob
          LC_ALL=C
          files=(*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release asset was prepared for publication."
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        run: |
          tag_sha=$(gh api repos/${{ github.repository }}/commits/$RELEASE_TAG --jq .sha)
          if [ "$tag_sha" != "${{ needs.validate.outputs.sha }}" ]; then
            echo "Release tag $RELEASE_TAG moved from validated commit ${{ needs.validate.outputs.sha }} to $tag_sha."
            exit 1
          fi
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = 'false' ]; then
            echo "Release $RELEASE_TAG is already published and will not be replaced."
            exit 1
          fi
          if [ "$existing" = 'true' ]; then
            gh release view "$RELEASE_TAG" --json assets > draft-release.json
            node scripts/release/prune-draft-release-assets.mjs --assets draft-release.json --expected release-assets > stale-assets.txt
            while IFS= read -r stale; do
              [ -n "$stale" ] || continue
              echo "Deleting stale draft asset: $stale"
              gh release delete-asset "$RELEASE_TAG" "$stale" --yes
            done < stale-assets.txt
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --fail-on-no-commits \
              --generate-notes \
              --notes "Every installer and archive is covered by SHA256SUMS.txt and GitHub build-provenance attestations." \
              --title "OMP Desktop ${RELEASE_TAG#v}" \
              --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add release link to the job summary
        run: echo "Published [$RELEASE_TAG]($(gh release view "$RELEASE_TAG" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

  rust-update-feed:
    name: Publish the Rust updater feed
    # The feed is attached to an existing release, so it runs after publication
    # and only when every signed Rust package was produced. The release
    # aggregate already fails when a package is missing, so this job never
    # publishes a feed for an empty release.
    needs: [validate, release-packages, package-rust]
    if: >-
      always() && needs.release-packages.result == 'success' && needs.package-rust.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: rust-package-*
          path: rust-artifacts
      # download-artifact extracts each artifact into a `rust-package-<os>-<arch>`
      # directory; the feed script reads `<os>-<arch>` directory names.
      - name: Lay the artifacts out as <os>-<arch> platform directories
        run: |
          shopt -s nullglob
          for directory in rust-artifacts/rust-package-*; do
            mv "$directory" "rust-artifacts/${directory##*rust-package-}"
          done
      - name: Detect cargo-packager signatures
        id: signatures
        run: |
          if [ -d rust-artifacts ] && find rust-artifacts -name '*.sig' -type f | grep -q .; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No cargo-packager signatures were published; skipping the Rust updater feed because the updater rejects unsigned artifacts."
          fi
      # The feed version is the Rust app's compiled version, which the updater
      # compares against; the tag only names the release the URLs resolve to.
      - name: Generate and upload the Rust updater feed
        if: steps.signatures.outputs.signed == 'true'
        run: |
          node scripts/release/prepare-rust-update-feed.mjs \
            --version-file rust/Cargo.toml \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
            --artifacts rust-artifacts \
            --output rust-update-feed/updates.json
          gh release upload "$RELEASE_TAG" rust-update-feed/updates.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

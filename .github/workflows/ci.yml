name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      adapter_cmd:
        description: Optional conformance adapter command (defaults to reference Node adapter)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.sha) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      # pull_request defaults to a synthetic merge ref; audit the immutable PR
      # head itself so this required status names the exact proposed lockfile.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight:toolchain
      - name: Apply named production dependency audit exceptions
        run: npm run audit:production

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run typecheck
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build:bundle
      - run: npm run release:bundle-size
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  hermetic-e2e:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: npm run test:e2e:hermetic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: error

  windows-state-migration:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm exec -- vitest run tests/backend/store-windows-migration.test.ts

  conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: ubuntu-22.04
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    env:
      OMP_CONFORMANCE_ADAPTER_CMD: ${{ inputs.adapter_cmd || vars.OMP_CONFORMANCE_ADAPTER_CMD || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - name: Build reference Node conformance adapter
        if: env.OMP_CONFORMANCE_ADAPTER_CMD == ''
        run: npm run conformance:build-adapter
      - name: Run conformance test suite
        run: npm run test:conformance

  packaging-smoke:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
            arch: arm64
            extra_args: --config.mac.identity=null
          - runner: ubuntu-22.04
            target: linux
            arch: x64
            extra_args: ''
          - runner: windows-2022
            target: win
            arch: x64
            extra_args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: node node_modules/electron-builder/cli.js --dir --${{ matrix.target }} --${{ matrix.arch }} --publish=never --config.directories.output=release/${{ matrix.target }}/${{ matrix.arch }} ${{ matrix.extra_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: matrix.target != 'mac'
        run: node scripts/release/verify-cross-platform-package.mjs --platform ${{ matrix.target }} --arch ${{ matrix.arch }} --unpacked-only
      # The Linux packages install chrome-sandbox setuid-root, so the smoke restores
      # those shipped permissions rather than launching with the sandbox disabled.
      - if: matrix.target == 'linux'
        run: |
          sudo chown root:root release/linux/${{ matrix.arch }}/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux/${{ matrix.arch }}/linux-unpacked/chrome-sandbox
      - name: Launch the packaged application
        run: node scripts/release/smoke-packaged-app.mjs --platform ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: packaged-smoke-diagnostics-${{ matrix.target }}-${{ matrix.arch }}
          path: release/${{ matrix.target }}/${{ matrix.arch }}/packaged-smoke-diagnostics.log
          if-no-files-found: error

  local-qa-package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            package: npm run package:mac:local-qa
            artifact: omp-desktop-local-qa-macos
            # Installers only: never upload the unpacked application directory.
            path: |
              release/mac/**/*.dmg
              release/mac/**/*.zip
          - runner: ubuntu-22.04
            package: npm run package:linux:local-qa
            artifact: omp-desktop-local-qa-linux
            path: |
              release/linux/**/*.AppImage
              release/linux/**/*.deb
              release/linux/**/*.rpm
              release/linux/**/*.pacman
          - runner: windows-2022
            package: npm run package:win:local-qa
            artifact: omp-desktop-local-qa-windows
            path: |
              release/win/**/*.exe
              release/win/**/*.zip
              release/win/**/*.appx
              release/win/**/*.msix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: ${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  rust:
    name: Rust workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: ubuntu-22.04
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config xvfb
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.100.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo test --workspace --locked
          else
            cargo test --workspace --locked
          fi
        shell: bash
      - run: cargo build -p omp-conformance --locked

  rust-conformance:
    name: Rust conformance
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: ubuntu-22.04
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    env:
      OMP_CONFORMANCE_PARTIAL: '1'
      OMP_CONFORMANCE_REQUIRED_CAPABILITIES: state,projects,sessions,models,agent,git,checkouts,plugins,schedules,collaboration
      OMP_CONFORMANCE_INFO_FILE: conformance-adapter.json
      OMP_CONFORMANCE_VITEST_JSON: conformance-vitest.json
      OMP_CONFORMANCE_REPORT: conformance-summary.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - run: cargo build -p omp-conformance --locked
        working-directory: rust
      - name: Select the Rust adapter executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo 'OMP_CONFORMANCE_ADAPTER_ARGV=["rust/target/debug/omp-conformance.exe"]' >> "$GITHUB_ENV"
          else
            echo 'OMP_CONFORMANCE_ADAPTER_ARGV=["rust/target/debug/omp-conformance"]' >> "$GITHUB_ENV"
          fi
      - run: npm run toolchain:bootstrap
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - name: Run the conformance suite against the Rust adapter
        run: npm run test:conformance -- --reporter=json --outputFile="${{ env.OMP_CONFORMANCE_VITEST_JSON }}"
      - name: Summarize adapter capabilities and test counts
        if: always()
        run: node scripts/rust/summarize-conformance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-conformance-${{ matrix.runner }}
          path: |
            conformance-summary.json
            conformance-adapter.json
            conformance-vitest.json
          if-no-files-found: error

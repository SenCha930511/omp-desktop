name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('push-{0}', github.sha) || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-scripts:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm ci
      - run: npm run release:preflight
      - run: npm run typecheck
      - run: npm run check
      - run: npm test

  rust:
    name: Rust workspace
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: ubuntu-22.04
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config xvfb \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.100.0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.21.0
      - run: cargo deny check
      - name: Run workspace tests
        env:
          RUST_MIN_STACK: '16777216'
          RUST_TEST_THREADS: '1'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo test --workspace --locked
          else
            cargo test --workspace --locked
          fi
        shell: bash
      - run: cargo build -p omp-conformance --locked

  rust-conformance:
    name: Rust conformance
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: ubuntu-22.04
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    env:
      OMP_CONFORMANCE_PARTIAL: '1'
      OMP_CONFORMANCE_REQUIRED_CAPABILITIES: state,projects,sessions,models,agent,git,checkouts,plugins,schedules,collaboration
      OMP_CONFORMANCE_INFO_FILE: conformance-adapter.json
      OMP_CONFORMANCE_VITEST_JSON: conformance-vitest.json
      OMP_CONFORMANCE_REPORT: conformance-summary.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - run: cargo build -p omp-conformance --locked
        working-directory: rust
      - name: Select the Rust adapter executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo 'OMP_CONFORMANCE_ADAPTER_ARGV=["rust/target/debug/omp-conformance.exe"]' >> "$GITHUB_ENV"
          else
            echo 'OMP_CONFORMANCE_ADAPTER_ARGV=["rust/target/debug/omp-conformance"]' >> "$GITHUB_ENV"
          fi
      - run: npm run toolchain:bootstrap
      - run: npm ci
      - run: npm run release:preflight
      - name: Run the conformance suite against the Rust adapter
        run: node node_modules/vitest/vitest.mjs run --config vitest.conformance.config.ts --reporter=json --outputFile="${{ env.OMP_CONFORMANCE_VITEST_JSON }}"
      - name: Summarize adapter capabilities and test counts
        if: always()
        run: node scripts/rust/summarize-conformance.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-conformance-${{ matrix.runner }}
          path: |
            conformance-summary.json
            conformance-adapter.json
            conformance-vitest.json
          if-no-files-found: error

  rust-package-smoke:
    name: Rust packaged smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build the native application
        run: cargo build -p omp-desktop --locked
        working-directory: rust
      - name: Package the macOS application bundle
        run: cargo packager --formats app
        working-directory: rust/crates/omp-desktop
      - name: Launch the packaged application and wait for the first frame
        run: |
          rm -f "$RUNNER_TEMP/rust-smoke.json"
          "rust/dist/OMP Desktop.app/Contents/MacOS/omp-desktop" \
            --packaged-smoke="$RUNNER_TEMP/rust-smoke.json" \
            --user-data-dir="$RUNNER_TEMP/rust-user-data"
          test -s "$RUNNER_TEMP/rust-smoke.json"
          node -e "const m=require(process.env.RUNNER_TEMP + '/rust-smoke.json'); if (m.event !== 'gooeypi-packaged-smoke-ready') process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-packaged-smoke
          path: ${{ runner.temp }}/rust-smoke.json
          if-no-files-found: error

  rust-package-smoke-linux:
    name: Rust packaged smoke (Linux deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux GUI and headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config xauth xvfb \
            libegl1 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            fonts-dejavu-core xkb-data \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build the native application
        run: cargo build -p omp-desktop --locked
        working-directory: rust
      - name: Package the Linux deb
        run: cargo packager --formats deb
        working-directory: rust/crates/omp-desktop
      - name: Launch the packaged application under Xvfb and wait for the first frame
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          deb="$(ls rust/dist/omp-desktop_*_amd64.deb)"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/rust-deb"
          rm -f "$RUNNER_TEMP/rust-smoke.json"
          timeout --signal=KILL 180 xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$RUNNER_TEMP/rust-deb/usr/bin/omp-desktop" \
            --packaged-smoke="$RUNNER_TEMP/rust-smoke.json" \
            --user-data-dir="$RUNNER_TEMP/rust-user-data"
          test -s "$RUNNER_TEMP/rust-smoke.json"
          node -e "const m=require(process.env.RUNNER_TEMP + '/rust-smoke.json'); if (m.event !== 'gooeypi-packaged-smoke-ready') process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-packaged-smoke-linux
          path: |
            ${{ runner.temp }}/rust-smoke.json
            rust/dist/omp-desktop_*_amd64.deb
          if-no-files-found: error

  rust-package-smoke-windows:
    name: Rust packaged smoke (Windows nsis)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8
      - name: Build the native application
        run: cargo build -p omp-desktop --locked
        working-directory: rust
      # cargo-packager 0.11.8 downloads its own pinned NSIS 3.09 toolchain on
      # Windows, so no system NSIS install (`choco install nsis`) is required.
      - name: Package the Windows NSIS installer
        run: cargo packager --formats nsis
        working-directory: rust/crates/omp-desktop
      - name: Install the NSIS package silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path 'rust/dist' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'cargo-packager produced no NSIS installer in rust/dist' }
          $installDir = Join-Path $env:RUNNER_TEMP 'omp-nsis-install'
          # `/S` installs silently, `/NS` skips the desktop and Start menu
          # shortcuts, and `/D=` must be the last argument and unquoted.
          # RUNNER_TEMP contains no spaces, so argument quoting cannot break it.
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/NS', "/D=$installDir" -PassThru
          if (-not $process.WaitForExit(180000)) {
            taskkill /T /F /PID $process.Id
            throw 'The NSIS installer did not finish within three minutes'
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "The NSIS installer exited with $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'omp-desktop.exe'))) { throw "The installer did not place omp-desktop.exe in $installDir" }
      - name: Launch the installed application and wait for the first frame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'omp-nsis-install'
          $marker = Join-Path $env:RUNNER_TEMP 'rust-smoke.json'
          $userData = Join-Path $env:RUNNER_TEMP 'rust-user-data'
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath (Join-Path $installDir 'omp-desktop.exe') -ArgumentList "--packaged-smoke=$marker", "--user-data-dir=$userData" -PassThru
          if (-not $process.WaitForExit(240000)) {
            taskkill /T /F /PID $process.Id
            throw 'The packaged application did not exit after drawing the first frame'
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "The packaged application exited with $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'The packaged application exited without writing the readiness marker' }
          $markerJson = Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
          if ($markerJson.event -ne 'gooeypi-packaged-smoke-ready') { throw "Unexpected marker event: $($markerJson.event)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-packaged-smoke-windows
          path: |
            ${{ runner.temp }}/rust-smoke.json
            rust/dist/*-setup.exe
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- OMP Desktop mark: a desktop window tile carrying the pi symbol. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7565ea"/>
      <stop offset="1" stop-color="#4636b8"/>
    </linearGradient>
  </defs>
  <!-- Window tile -->
  <rect x="6" y="6" width="84" height="84" rx="20" fill="url(#tile)"/>
  <!-- Title bar slot -->
  <rect x="24" y="21" width="48" height="8" rx="4" fill="#fff"/>
  <!-- Pi top bar -->
  <rect x="28" y="41" width="40" height="9" rx="4" fill="#fff"/>
  <!-- Pi left leg (long) -->
  <rect x="33" y="41" width="10" height="33" rx="4" fill="#fff"/>
  <!-- Pi right leg (short) -->
  <rect x="53" y="41" width="10" height="29" rx="4" fill="#fff"/>
  <!-- Traffic-light dot -->
  <circle cx="31" cy="25" r="3.4" fill="#f97316"/>
</svg>
